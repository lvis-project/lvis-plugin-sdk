name: drift-check-pr

on:
  pull_request:
    paths:
      - 'src/index.ts'
      - 'schemas/plugin-manifest.schema.json'
      - 'scripts/sync-from-host.mjs'
      - 'scripts/sync-schema-from-host.mjs'
      - '.github/workflows/drift-check-pr.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Checkout Host source of truth
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: lvis-project/lvis-app
          ref: main
          path: .host
          fetch-depth: 1
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.1.38'
      - run: bun install --frozen-lockfile
      - name: Regenerate mirrors from Host
        env:
          LVIS_HOST_CONTRACT_PATH: ${{ github.workspace }}/.host/src/plugins/public-contract.ts
          LVIS_HOST_SCHEMA_PATH: ${{ github.workspace }}/.host/schemas/plugin-manifest.schema.json
          LVIS_HOST_REPO_URL: https://github.com/lvis-project/lvis-app.git
        run: |
          set -euo pipefail
          node scripts/sync-from-host.mjs
          node scripts/sync-schema-from-host.mjs
      - name: Fail on drift
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- src/index.ts schemas/plugin-manifest.schema.json; then
            echo "::error::Drift detected between SDK and Host source of truth. Regenerate and commit both mirrors."
            exit 1
          fi
