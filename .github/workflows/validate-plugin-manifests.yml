name: validate-plugin-manifests

# Fetch each active plugin's `plugin.json` via the GitHub API and validate
# it against the SDK's current `schemas/plugin-manifest.schema.json` using
# ajv-cli. Catches the "SDK schema tightened, plugin manifest still has the
# old shape" class of break.
#
# Runs only from trusted default-branch workflow code: on push to main,
# nightly, or repository_dispatch. Pull requests exercise the SDK's local
# schema tests but never receive the private plugin roster or GitHub App
# credentials.
#
# Matrix invariant: every entry MUST be a current, reachable plugin repo.
# A renamed/archived/deleted repo returns 404 and FAILS the job (see the
# "Gate token failure" step) so a future rename surfaces loudly here rather
# than silently dropping a plugin from validation. This is distinct from the
# legitimate "GitHub App not yet installed on a real repo" skip.
#
# The plugin repo list is NOT hardcoded here (this workflow is public) — it
# is read from the `PLUGIN_MANIFEST_REPOS` repository secret at runtime via
# the `resolve-matrix` job below. Keep the secret in sync with the active
# plugin roster: `gh secret set PLUGIN_MANIFEST_REPOS --repo lvis-project/lvis-plugin-sdk`.

on:
  push:
    branches: [main]
    paths:
      - 'schemas/plugin-manifest.schema.json'
  schedule:
    - cron: '37 4 * * *' # nightly ~04:37 UTC, after drift-check (03:17)
  repository_dispatch:
    types: [validate-plugin-manifests]

permissions:
  contents: read

concurrency:
  group: validate-plugin-manifests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-matrix:
    if: github.repository == 'lvis-project/lvis-plugin-sdk'
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.resolve.outputs.plugins }}
    steps:
      - name: Resolve plugin repo list from secret
        id: resolve
        env:
          PLUGIN_MANIFEST_REPOS: ${{ secrets.PLUGIN_MANIFEST_REPOS }}
        run: |
          set -euo pipefail
          if [ -z "${PLUGIN_MANIFEST_REPOS:-}" ]; then
            echo "::error title=Missing secret::PLUGIN_MANIFEST_REPOS secret not configured. Set it to a space-separated list of active plugin repo names via: gh secret set PLUGIN_MANIFEST_REPOS --repo lvis-project/lvis-plugin-sdk"
            exit 1
          fi
          read -r -a plugin_repos <<< "$PLUGIN_MANIFEST_REPOS"
          json=$(printf '%s\n' "${plugin_repos[@]}" | jq -R . | jq -sc .)
          echo "plugins=$json" >> "$GITHUB_OUTPUT"

  validate:
    needs: resolve-matrix
    if: github.repository == 'lvis-project/lvis-plugin-sdk'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.resolve-matrix.outputs.plugins) }}
    steps:
      - name: Checkout SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # `continue-on-error: true` lets the next step inspect the outcome and
      # decide between two very different 404 causes:
      #   1. The repo was renamed / archived / deleted (matrix is stale) —
      #      this MUST fail the job so the rename surfaces here loudly.
      #   2. The backing GitHub App is genuinely not yet installed on an
      #      existing repo (org-admin one-time action) — tolerated only when
      #      the repo is on the explicit APP_PENDING_REPOS allow-list below.
      # A bare 404 with the repo NOT on the allow-list fails (no silent skip).
      - name: Generate read token for plugin repo
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: lvis-project
          repositories: ${{ matrix.plugin }}

      # Reviewed allow-list of repos where the App install is known to be
      # pending, read from the `PLUGIN_MANIFEST_PENDING_REPOS` repository
      # secret (space-separated repo names). Unset/empty is the correct
      # steady state: every active plugin repo should have the App
      # installed, so an unexpected token failure is a stale-matrix
      # (renamed/archived/deleted) signal and must fail. To tolerate a
      # genuinely-pending install, add the exact repo name to the secret via
      # a reviewed change — never widen this to a blanket skip.
      #
      # DEFERRED STATE (prod-hardening Known Issue #7 — "HOST_READ_TOKEN
      # fine-grained PAT 교체 필요"): the GitHub App backing HOST_READ_TOKEN is
      # NOT yet installed on the plugin repos, so create-github-app-token fails
      # for ALL of them. Until the org-admin installs the App, every active
      # plugin is listed in the pending secret so the job skips-with-`::warning`
      # (loud, non-failing) instead of blocking CI. This is NOT a silent
      # disable: each skip emits a warning naming the repo and the required
      # follow-up.
      # REQUIRED follow-up: once the App is installed on a repo, REMOVE that
      # repo from the PLUGIN_MANIFEST_PENDING_REPOS secret so real cross-repo
      # manifest validation reactivates. An empty/unset secret is the correct
      # steady state.
      - name: Gate token failure (fail on stale matrix, allow only pending installs)
        if: steps.app-token.outcome != 'success'
        env:
          # Pending HOST_READ_TOKEN App install (Known Issue #7) — remove each
          # repo from the secret as the App is installed on it. Target: unset.
          APP_PENDING_REPOS: ${{ secrets.PLUGIN_MANIFEST_PENDING_REPOS }}
          PLUGIN: ${{ matrix.plugin }}
        run: |
          set -euo pipefail
          for allowed in $APP_PENDING_REPOS; do
            if [ "$allowed" = "$PLUGIN" ]; then
              echo "::warning title=GitHub App install pending::HOST_READ_TOKEN App is not yet installed on lvis-project/${PLUGIN} (explicitly allow-listed) — manifest validation skipped. Install the App via org settings, then remove it from APP_PENDING_REPOS."
              exit 0
            fi
          done
          echo "::error title=Plugin repo unreachable::Could not mint a read token for lvis-project/${PLUGIN}. The repo is renamed, archived, or deleted (stale matrix), or the GitHub App is not installed and the repo is not on APP_PENDING_REPOS. Update strategy.matrix.plugin or the allow-list."
          exit 1

      - name: Fetch plugin.json from ${{ matrix.plugin }}@main
        if: steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # Plugins keep `plugin.json` at the repo root. Use the contents API
          # so we don't have to clone the whole plugin repo just to read one
          # file. The API returns base64-encoded content.
          gh api \
            "repos/lvis-project/${{ matrix.plugin }}/contents/plugin.json?ref=main" \
            --jq '.content' \
            | base64 --decode > plugin.json
          echo "::group::plugin.json"
          cat plugin.json
          echo "::endgroup::"

      - name: Install ajv-cli
        if: steps.app-token.outcome == 'success'
        run: npm install --no-save ajv-cli@5 ajv-formats@2

      - name: Validate plugin.json against SDK schema
        if: steps.app-token.outcome == 'success'
        run: |
          set -euo pipefail
          npx ajv-cli validate \
            --spec=draft7 \
            --strict=false \
            -c ajv-formats \
            -s schemas/plugin-manifest.schema.json \
            -d plugin.json

      - name: Open issue on validation failure (nightly only)
        if: failure() && github.event_name == 'schedule' && steps.app-token.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const title = `validate-plugin-manifests: ${{ matrix.plugin }} drift`;
            const body =
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              `\`${{ matrix.plugin }}\`'s \`plugin.json\` no longer validates against the SDK schema. ` +
              `Either bump the plugin to fix the manifest or update the SDK schema if the contract intentionally changed.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci', 'plugin-manifest-drift'],
            });
