name: drift-check
on:
  schedule:
    - cron: '17 3 * * *'   # nightly ~03:17 UTC
  repository_dispatch:
    types: [sdk-drift-sync]
concurrency:
  group: drift-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: github.repository == 'lvis-project/lvis-plugin-sdk'
    # The SDK is public, so every event uses GitHub-hosted CI. Oracle runners
    # are reserved for private repositories and their internal workflows.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Checkout host repo (public)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: lvis-project/lvis-app
          # Pin the contract source to the host production branch.
          ref: main
          path: .host
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: '1.1.38'
      - name: Install
        run: bun install --frozen-lockfile
      - name: Run sync against Host public contract
        env:
          LVIS_HOST_CONTRACT_PATH: ${{ github.workspace }}/.host/src/plugins/public-contract.ts
          LVIS_HOST_REPO_URL: https://github.com/lvis-project/lvis-app.git
        run: node scripts/sync-from-host.mjs

      # The schema mirror is regenerated by the same rule as the type surface.
      # It went unchecked for a full authority migration (the host moved the
      # schema to `schemas/plugin-manifest.schema.json` and the sync script was
      # still reading the old `schemas/plugin.schema.json` path, so it errored
      # out and nothing noticed) — this step is what makes the mirror provably a
      # mirror.
      - name: Run schema sync against host schema
        env:
          LVIS_HOST_SCHEMA_PATH: ${{ github.workspace }}/.host/schemas/plugin-manifest.schema.json
        run: node scripts/sync-schema-from-host.mjs
      # The second run must produce byte-identical output, guarding against
      # any accidental non-determinism in the mechanical copy.
      - name: Verify sync-from-host is idempotent
        env:
          LVIS_HOST_CONTRACT_PATH: ${{ github.workspace }}/.host/src/plugins/public-contract.ts
        run: |
          set -euo pipefail
          for f in src/index.ts; do
            cp "$f" "/tmp/$(echo "$f" | tr '/' '_').firstrun"
          done
          node scripts/sync-from-host.mjs
          for f in src/index.ts; do
            if ! diff -u "/tmp/$(echo "$f" | tr '/' '_').firstrun" "$f"; then
              echo "::error::sync-from-host.mjs is not idempotent — second run produced different output for $f"
              exit 1
            fi
          done
      - name: Remove host checkout
        run: rm -rf .host
      - name: Check for drift
        id: diff
        run: |
          # Both mirrors of the host contract: the public type surface
          # (src/index.ts, from the Host's public-contract.ts) and the manifest
          # schema (schemas/plugin-manifest.schema.json, from the host file of the
          # same name). A host-side change the SDK author forgets to regenerate
          # would otherwise pass green and ship a stale contract to plugins.
          if git diff --quiet -- src/index.ts schemas/plugin-manifest.schema.json; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open PR on drift
        if: steps.diff.outputs.drift == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/auto-drift-sync
          title: 'chore: auto-sync from host SoT (types + schema)'
          commit-message: 'chore: auto-sync from host SoT (types + schema)'
          body: |
            Nightly drift-check detected divergence between `lvis-app` and this SDK.
            Auto-regenerated via `scripts/sync-from-host.mjs` and
            `scripts/sync-schema-from-host.mjs`.

            Please review the diff in `src/index.ts` and
            `schemas/plugin-manifest.schema.json` before merging.
          base: main
          delete-branch: true
      # Drift can also clear without this PR being merged: the same host change
      # gets mirrored by hand, with the version bump, CHANGELOG entry, and tests
      # the mechanical sync cannot write. When that happens the open PR keeps
      # asserting "divergence detected" while holding an OLDER regeneration than
      # main, so merging it REVERTS the hand-written mirror. Nothing closed it,
      # so it sat open for weeks inviting exactly that merge. The PR's claim is
      # only true while drift is true — so retract it when drift is false.
      - name: Close the drift PR once drift has cleared
        if: steps.diff.outputs.drift == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          number="$(gh pr list --head chore/auto-drift-sync --state open \
            --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            echo "No open drift PR to close."
            exit 0
          fi
          gh pr comment "$number" --body \
            "Drift has cleared — regenerating both mirrors from the host now reproduces \`main\` byte for byte. This branch holds an older regeneration than \`main\`, so merging it would revert the mirror that landed since. Closing; a fresh PR opens automatically if drift returns."
          gh pr close "$number" --delete-branch
      - name: Open issue on workflow failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const title = `drift-check failed on ${context.sha.slice(0,7)}`;
            const body = `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nLikely causes:\n- Host public-contract.ts moved\n- Network or checkout failure`;
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['ci','drift-check'] });
