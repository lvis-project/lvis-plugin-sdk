name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing annotated tag to release (e.g. v11.0.0)'
        required: true
        type: string
      host_ref:
        description: 'Optional expected 40-character lvis-app SHA; must match the tag Host-Ref trailer'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve requested tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf 'name=%s\n' "$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          else
            printf 'name=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout at tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ steps.tag.outputs.name }}
          fetch-depth: 0

      - name: Verify annotated tag and SDK release commit
        id: integrity
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
          EXPECTED_HOST_REF: ${{ inputs.host_ref }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(
            release
            --tag "$RELEASE_TAG"
            --main-ref origin/main
            --output "$GITHUB_OUTPUT"
            --summary "$GITHUB_STEP_SUMMARY"
            --provenance /tmp/lvis-sdk-release-provenance.json
          )
          if [ -n "$EXPECTED_HOST_REF" ]; then
            args+=(--expected-host-ref "$EXPECTED_HOST_REF")
          fi
          if [ "$EVENT_NAME" = "push" ]; then
            args+=(--expected-release-sha "$EVENT_SHA")
          fi
          node scripts/verify-release-integrity.mjs "${args[@]}"

      - name: Checkout exact Host contract commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: lvis-project/lvis-app
          ref: ${{ steps.integrity.outputs.host_ref }}
          path: .release-host
          fetch-depth: 0

      - name: Verify Host commit belongs to Host main
        env:
          HOST_REF: ${{ steps.integrity.outputs.host_ref }}
        run: |
          node scripts/verify-release-integrity.mjs host \
            --repo .release-host \
            --host-ref "$HOST_REF" \
            --main-ref origin/main \
            --summary "$GITHUB_STEP_SUMMARY"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: '1.1.38'

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build

      - name: Verify source contract drift against exact Host commit
        env:
          LVIS_HOST_TYPES_PATH: ${{ github.workspace }}/.release-host/src/plugins/types.ts
        run: bun run check:drift

      - name: Verify schema drift against exact Host commit
        env:
          LVIS_HOST_SCHEMA_PATH: ${{ github.workspace }}/.release-host/schemas/plugin-manifest.schema.json
        run: bun run check:schema-drift

      - name: Verify committed dist
        run: bun run check:dist-drift

      - name: Refuse to mutate an existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.integrity.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::GitHub Release $RELEASE_TAG already exists; immutable releases cannot be updated in place"
            exit 1
          fi

      - name: Extract changelog section
        id: changelog
        env:
          RELEASE_TAG: ${{ steps.integrity.outputs.tag }}
          RELEASE_SHA: ${{ steps.integrity.outputs.release_sha }}
          HOST_REF: ${{ steps.integrity.outputs.host_ref }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          node scripts/extract-release-notes.mjs \
            --tag "$TAG" \
            --changelog CHANGELOG.md \
            --output /tmp/release-notes.md
          {
            printf '\n'
            printf '## Release provenance\n\n'
            printf -- "- SDK commit: \`%s\`\n" "$RELEASE_SHA"
            printf -- "- Host contract commit: \`%s\`\n" "$HOST_REF"
          } >> /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          body_path: /tmp/release-notes.md
          files: /tmp/lvis-sdk-release-provenance.json
          draft: false
          prerelease: false
          make_latest: true
